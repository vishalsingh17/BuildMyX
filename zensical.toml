[project.theme]
variant = "classic"
custom_dir = "learning/overrides"
language = "en"
font = false
favicon = "assets/mark.svg"
logo = "assets/mark.svg"
features = ["navigation.tabs", "navigation.sections", "navigation.expand", "navigation.path", "navigation.footer", "navigation.top", "toc.follow", "search.highlight", "content.code.copy"]

[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "custom"

[project.extra]
indexing_allowed = false

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight.pygments_lang_class = true
